server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback necessario per le Single-Page Application: se il file
        # richiesto non esiste fisicamente (es. /hackathon/5), Nginx
        # restituisce comunque index.html e lascia gestire la rotta
        # al router Angular lato client.
        try_files $uri $uri/ /index.html;
    }
}