<h2>I miei inviti</h2>

<p *ngIf="caricamento">Caricamento in corso...</p>
<p *ngIf="errore" class="errore">{{ errore }}</p>
<p *ngIf="messaggio">{{ messaggio }}</p>

<ul *ngIf="!caricamento && inviti.length > 0">
    <li *ngFor="let i of inviti">
    <span *ngIf="i.tipo === 'STAFF'">
      <strong>{{ i.titolo }}</strong> — invito come <strong>{{ i.dettaglio }}</strong>
    </span>
        <span *ngIf="i.tipo === 'TEAM'">
      Invito a unirti al team <strong>{{ i.titolo }}</strong> (da {{ i.dettaglio }})
    </span>
        <br>
        <button type="button" (click)="rispondi(i, true)">Accetta</button>
        <button type="button" (click)="rispondi(i, false)">Rifiuta</button>
    </li>
</ul>
<p *ngIf="!caricamento && inviti.length === 0">Nessun invito in sospeso.</p>
