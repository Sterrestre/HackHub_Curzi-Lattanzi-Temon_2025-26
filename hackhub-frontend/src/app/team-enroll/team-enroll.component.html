<p><a [routerLink]="['/hackathon', hackathonId]">← Torna al dettaglio hackathon</a></p>

<h2>Iscrivi il tuo team</h2>

<div *ngIf="inviato" class="esito-positivo">
    <p>Team iscritto con successo!</p>
    <ul>
        <li>Id team: <strong>{{ teamCreatoId }}</strong></li>
        <li>Id iscrizione: <strong>{{ teamIscrittoId }}</strong></li>
    </ul>
    <p>
        <a [routerLink]="['/team', teamCreatoId]">Gestisci i membri del team</a>
        &nbsp;|&nbsp;
        <a [routerLink]="['/hackathon', hackathonId, 'sottometti']">Carica una sottomissione</a>
    </p>
</div>

<p *ngIf="errore" class="errore">{{ errore }}</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!inviato">

    <label>
        Nome del team
        <input type="text" formControlName="nomeTeam">
    </label>

    <button type="submit">Iscrivi team</button>
</form>
