#FILE YML PER IDS (Spring Boot application + MySQL):

services:
  hackhub:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - variabili.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      FRONTEND_URL: http://localhost
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    env_file:
      - variabili.env

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - hackhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./hackhub-frontend
    ports:
      - "80:80"
    depends_on:
      - hackhub

volumes:
  hackhub_mysql_data: